<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .bone-bg { fill: #F2F0EB; }
      .carbon-line { stroke: #1A1917; stroke-width: 1.5px; fill: none; }
      .ash-line { stroke: #8A867D; stroke-width: 1px; stroke-dasharray: 4,4; fill: none; }
      .label-head { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #1A1917; letter-spacing: 0.08em; text-transform: uppercase; }
      .label-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8A867D; letter-spacing: 0.1em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Flat Bone Background -->
  <rect width="1000" height="480" class="bone-bg"/>

  <!-- Top Pattern-Cutting Header -->
  <text x="50" y="45" class="label-head">PATTERN SHEET // N° 02 — SYNAPSE DUAL RETRIEVAL</text>
  <text x="950" y="45" class="label-tag" text-anchor="end">SPEC: 100% JS · 0 DEPENDENCIES</text>
  <line x1="50" y1="60" x2="950" y2="60" stroke="#C8C5BE" stroke-width="1"/>

  <!-- NODE 1: Incoming Context (Open Corner Brackets) -->
  <g transform="translate(50, 180)">
    <!-- Top-Left & Bottom-Right Corner Marks -->
    <path d="M 0,15 L 0,0 L 15,0" class="carbon-line"/>
    <path d="M 165,80 L 180,80 L 180,65" class="carbon-line"/>
    <path d="M 180,15 L 180,0 L 165,0" class="carbon-line"/>
    <path d="M 0,65 L 0,80 L 15,80" class="carbon-line"/>
    
    <text x="90" y="38" class="label-head" text-anchor="middle">AGENT QUERY</text>
    <text x="90" y="58" class="label-tag" text-anchor="middle">[ UNSTRUCTURED ]</text>
  </g>

  <!-- Arrow to Dual-Track -->
  <line x1="230" y1="220" x2="310" y2="150" class="carbon-line"/>
  <polygon points="310,150 300,152 304,160" fill="#1A1917"/>

  <line x1="230" y1="220" x2="310" y2="290" class="carbon-line"/>
  <polygon points="310,290 304,280 300,288" fill="#1A1917"/>

  <!-- NODE 2: HNSW Dense Track (Top) -->
  <g transform="translate(310, 110)">
    <path d="M 0,15 L 0,0 L 15,0" class="carbon-line"/>
    <path d="M 225,80 L 240,80 L 240,65" class="carbon-line"/>
    <path d="M 240,15 L 240,0 L 225,0" class="carbon-line"/>
    <path d="M 0,65 L 0,80 L 15,80" class="carbon-line"/>

    <text x="120" y="34" class="label-head" text-anchor="middle">HNSW SKIP-GRAPH</text>
    <text x="120" y="52" class="label-tag" text-anchor="middle">SQ8 INT8 QUANTIZED</text>
    <text x="120" y="66" class="label-tag" text-anchor="middle">O(LOG N) BEAM SEARCH</text>
  </g>

  <!-- NODE 3: BM25 Sparse Track (Bottom) -->
  <g transform="translate(310, 250)">
    <path d="M 0,15 L 0,0 L 15,0" class="carbon-line"/>
    <path d="M 225,80 L 240,80 L 240,65" class="carbon-line"/>
    <path d="M 240,15 L 240,0 L 225,0" class="carbon-line"/>
    <path d="M 0,65 L 0,80 L 15,80" class="carbon-line"/>

    <text x="120" y="34" class="label-head" text-anchor="middle">BM25 INVERTED INDEX</text>
    <text x="120" y="52" class="label-tag" text-anchor="middle">SPARSE TERM FREQUENCY</text>
    <text x="120" y="66" class="label-tag" text-anchor="middle">IDF ROBERTSON-SPARCK</text>
  </g>

  <!-- Arrows to Fusion -->
  <line x1="550" y1="150" x2="630" y2="200" class="carbon-line"/>
  <polygon points="630,200 620,195 622,204" fill="#1A1917"/>

  <line x1="550" y1="290" x2="630" y2="240" class="carbon-line"/>
  <polygon points="630,240 622,236 620,245" fill="#1A1917"/>

  <!-- NODE 4: RRF Fusion Engine -->
  <g transform="translate(630, 180)">
    <path d="M 0,15 L 0,0 L 15,0" class="carbon-line"/>
    <path d="M 165,80 L 180,80 L 180,65" class="carbon-line"/>
    <path d="M 180,15 L 180,0 L 165,0" class="carbon-line"/>
    <path d="M 0,65 L 0,80 L 15,80" class="carbon-line"/>

    <text x="90" y="34" class="label-head" text-anchor="middle">RRF FUSION</text>
    <text x="90" y="52" class="label-tag" text-anchor="middle">ALPHA BLEND (0.65)</text>
    <text x="90" y="66" class="label-tag" text-anchor="middle">DECAY: e^(-λ·Δt)</text>
  </g>

  <!-- Arrow to Output -->
  <line x1="810" y1="220" x2="860" y2="220" class="carbon-line"/>
  <polygon points="860,220 850,215 850,225" fill="#1A1917"/>

  <!-- NODE 5: Working Memory Output -->
  <g transform="translate(860, 180)">
    <circle cx="45" cy="40" r="30" fill="none" stroke="#1A1917" stroke-width="1.5"/>
    <circle cx="45" cy="40" r="2" fill="#1A1917"/>
    <text x="45" y="36" class="label-head" text-anchor="middle" font-size="10px">TOP-K</text>
    <text x="45" y="50" class="label-tag" text-anchor="middle" font-size="9px">MEMORY</text>
  </g>

  <!-- Pattern Cutting Seam Marks (Bottom) -->
  <g transform="translate(50, 420)">
    <line x1="0" y1="0" x2="900" y2="0" class="ash-line"/>
    <text x="0" y="25" class="label-tag">CUT 01 // HORIZONTAL VECTOR INGESTION</text>
    <text x="450" y="25" class="label-tag" text-anchor="middle">SEAM TOLERANCE: &lt;0.001% DISTORTION</text>
    <text x="900" y="25" class="label-tag" text-anchor="end">LOT: 2026-V8</text>
  </g>
</svg>
